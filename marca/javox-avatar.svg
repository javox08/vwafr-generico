<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="JAVOX">
  <title>JAVOX</title>
  <defs>
    <radialGradient id="bgj" cx="0.5" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#1A1338"/>
      <stop offset="0.6" stop-color="#0C0918"/>
      <stop offset="1" stop-color="#06050C"/>
    </radialGradient>
    <!-- Un solo degradado de marca, y el morado con luminancia alta para que el
         gancho NO se apague al reducir (fallo detectado en la prueba de squint). -->
    <linearGradient id="neon" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#B57BFF"/>
      <stop offset="0.42" stop-color="#7BE86B"/>
      <stop offset="1" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <circle cx="512" cy="512" r="512" fill="url(#bgj)"/>

  <!-- aro: mismo degradado que la marca (antes competían dos distintos) -->
  <circle cx="512" cy="512" r="454" fill="none" stroke="url(#neon)" stroke-width="14" opacity="0.85"/>
  <circle cx="512" cy="512" r="454" fill="none" stroke="#39FF14" stroke-width="22" opacity="0.16" filter="url(#gl)"/>

  <!-- Monograma J. Sin flecha pegada: la marca se lee limpia en silueta.
       Trazo grueso y uniforme para que aguante a 32 px. -->
  <g filter="url(#gl)" opacity="0.45">
    <path d="M360 342 H676 M612 342 V590 A152 152 0 0 1 308 590"
          fill="none" stroke="url(#neon)" stroke-width="106" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M360 342 H676 M612 342 V590 A152 152 0 0 1 308 590"
        fill="none" stroke="url(#neon)" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Guiño alcista SEPARADO del logotipo (sin tangencia): tres velas ascendentes
       con opacidad suficiente para verse de verdad, no al 13%. -->
  <g opacity="0.62">
    <rect x="726" y="606" width="26" height="86" rx="10" fill="#39FF14"/>
    <rect x="774" y="556" width="26" height="136" rx="10" fill="#39FF14"/>
    <rect x="822" y="486" width="26" height="206" rx="10" fill="#B57BFF"/>
  </g>
</svg>
